---
name: Build Docker

on:
  push:
    branches:
      - main

  pull_request:
    types:
      - opened
      - synchronize
      - ready_for_review
concurrency:
  group: k6
  cancel-in-progress: true

jobs:

  build:
    name: docker
    runs-on: depot-ubuntu-24.04
    steps:
      - name: Checkout hoprnet repository
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0

      - name: Set up Google Cloud Credentials
        id: auth
        uses: google-github-actions/auth@3a3c4c57d294ef65efaaee4ff17b22fa88dd3c69 # v1.3.0
        with:
          token_format: "access_token"
          credentials_json: ${{ secrets.GOOGLE_HOPRASSOCIATION_CREDENTIALS_REGISTRY }}

      - name: Login Google Container Registry
        uses: docker/login-action@465a07811f14bebb1938fbed4728c6a1ff8901fc # v2.2.0
        with:
          registry: europe-west3-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@885d1462b80bc1c1c7f0b00334ad271f09369c55 # v2.10.0
        with:
          driver: kubernetes

      - name: Get docker tag
        id: vars
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "TAG=pr-${{ github.event.pull_request.number }}" | tee -a "$GITHUB_OUTPUT"
          else
            echo "TAG=latest" | tee -a "$GITHUB_OUTPUT"
          fi

      - name: Build and push docker image
        uses: docker/build-push-action@0a97817b6ade9f46837855d676c4cca3a2471fc9 # v4.2.1
        with:
          push: true
          context: k6
          tags: europe-west3-docker.pkg.dev/${{ secrets.GOOGLE_HOPRASSOCIATION_PROJECT }}/docker-images/hoprd-k6:${{ steps.vars.outputs.TAG }}
  
